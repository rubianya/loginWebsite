<div class="page-background">
  <div class="login-card">

    <h1>WEBSITE</h1>
    <p>Login to your account</p>

    <input type="username" placeholder="Username" [(ngModel)]="username"/>
    <input type="password" placeholder="Password" [(ngModel)]="password"/>

    <div class="remember">
      <input type="checkbox">
      <span> Remember Me</span>
    </div>

    <button (click)="login()">Login</button>
    <p>Don't have an account?<span routerLink="/register"><b> Register here</b></span></p>

  </div>
</div>
